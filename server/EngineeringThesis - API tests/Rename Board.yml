info:
  name: Rename Board
  type: http
  seq: 6

http:
  method: PUT
  url: "{{host}}/rename-board"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "mac_address": 1234,
        "name": "api-test"
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
