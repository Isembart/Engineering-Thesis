info:
  name: Update Board Settings
  type: http
  seq: 4

http:
  method: PUT
  url: "{{host}}/board-settings?mac_address=1234"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: mac_address
      value: "1234"
      type: query
  body:
    type: json
    data: |-
      {
        "scans_per_send": 3,
        "wifi_scan_time_ms": 10000,
        "bluetooth_scan_time_ms": 5000,
        "wifi_channel_scan_time_ms": 250,
        "minimal_encounter_count": 3,
        "min_rssi": -75,
        "min_rssi_ble": -85
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
