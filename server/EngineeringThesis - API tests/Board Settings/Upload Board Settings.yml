info:
  name: Upload Board Settings
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/board-settings?mac_address=18406680123616"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: mac_address
      value: "18406680123616"
      type: query
  body:
    type: json
    data: |-
      {
        "scans_per_send": 1,
        "wifi_scan_time": 6,
        "bluetooth_scan_time": 5,
        "wifi_channel_scan_time": 5,
        "bluetooth_channel_scan_time": 5,
        "minimal_encounter_count": 3,
        "min_rssi": -75,
        "server_endpoint": "http://localhost:8000"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
