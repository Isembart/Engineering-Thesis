info:
  name: Get Board Settings
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/board-settings?mac_address=1234"
  params:
    - name: mac_address
      value: "1234"
      type: query
  auth:
    type: bearer
    token: "{{admin_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
