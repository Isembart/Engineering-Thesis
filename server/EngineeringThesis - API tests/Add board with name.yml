info:
  name: Add board with name
  type: http
  seq: 4

http:
  method: POST
  url: "{{host}}/add-board"
  body:
    type: json
    data: |-
      {
        "mac_address": 1234,
        "name": "testName"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
