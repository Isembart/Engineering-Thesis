info:
  name: Firmware Latest Without Token
  type: http
  seq: 7

http:
  method: GET
  url: "{{host}}/firmware/latest?mac_address=1234&version=1"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
