info:
  name: Rename Without Token
  type: http
  seq: 6

http:
  method: PUT
  url: "{{host}}/rename-board"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "mac_address": 1234,
        "name": "x"
      }
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
