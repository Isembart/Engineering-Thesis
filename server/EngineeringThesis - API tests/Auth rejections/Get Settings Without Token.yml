info:
  name: Get Settings Without Token
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/board-settings?mac_address=1234"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
