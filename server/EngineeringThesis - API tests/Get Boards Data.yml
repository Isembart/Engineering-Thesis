info:
  name: Get Boards Data
  type: http
  seq: 4

http:
  method: GET
  url: "{{host}}/get-board-data?mac_address=1234"
  params:
    - name: mac_address
      value: "1234"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
