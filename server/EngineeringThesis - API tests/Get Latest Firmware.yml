info:
  name: Get Latest Firmware
  type: http
  seq: 6

http:
  method: GET
  url: "{{host}}/firmware/latest?mac_address=1234&version=1"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
